<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 A股智能分析仪表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: #718096;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card .label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #1a202c;
        }
        
        .stat-card.buy .value { color: #10b981; }
        .stat-card.hold .value { color: #f59e0b; }
        .stat-card.sell .value { color: #ef4444; }
        
        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 24px;
        }
        
        .stock-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stock-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .stock-name {
            font-size: 20px;
            font-weight: bold;
            color: #1a202c;
        }
        
        .stock-code {
            font-size: 14px;
            color: #718096;
        }
        
        .signal-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .signal-buy { background: #d1fae5; color: #065f46; }
        .signal-hold { background: #fef3c7; color: #92400e; }
        .signal-sell { background: #fee2e2; color: #991b1b; }
        
        .score {
            font-size: 36px;
            font-weight: bold;
            margin: 16px 0;
        }
        
        .score.high { color: #10b981; }
        .score.medium { color: #f59e0b; }
        .score.low { color: #ef4444; }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #718096;
            font-size: 14px;
        }
        
        .info-value {
            color: #1a202c;
            font-size: 14px;
            font-weight: 500;
        }
        
        .dashboard-section {
            margin-top: 24px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a202c;
            margin-bottom: 12px;
        }
        
        .checklist {
            list-style: none;
            padding: 0;
        }
        
        .checklist li {
            padding: 8px 0;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }
        
        @media (max-width: 768px) {
            .stocks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 A股智能分析仪表盘</h1>
            <div class="subtitle">实时分析结果 | 最后更新: <span id="lastUpdate">加载中...</span></div>
        </div>
        
        <div id="stats" class="stats">
            <!-- 统计信息将在这里动态加载 -->
        </div>
        
        <div id="stocks" class="stocks-grid">
            <div class="loading">正在加载分析结果...</div>
        </div>
    </div>
    
    <script>
        // 获取GitHub Pages的URL
        const repoName = window.location.pathname.split('/')[1] || 'daily_stock_analysis';
        const dataUrl = `/${repoName}/dashboard_data.json`;
        
        async function loadDashboard() {
            try {
                const response = await fetch(dataUrl);
                const data = await response.json();
                
                if (!data.success || !data.stocks) {
                    document.getElementById('stocks').innerHTML = 
                        `<div class="error">暂无分析结果</div>`;
                    return;
                }
                
                // 更新最后更新时间
                if (data.last_update) {
                    const updateTime = new Date(data.last_update);
                    document.getElementById('lastUpdate').textContent = 
                        updateTime.toLocaleString('zh-CN');
                } else {
                    document.getElementById('lastUpdate').textContent = '未知';
                }
                
                // 更新统计信息
                updateStats(data.stats || data);
                
                // 更新股票列表
                updateStocks(data.stocks);
                
            } catch (error) {
                document.getElementById('stocks').innerHTML = 
                    `<div class="error">加载失败: ${error.message}<br>请确保已运行分析并生成了数据文件</div>`;
            }
        }
        
        function updateStats(data) {
            const statsDiv = document.getElementById('stats');
            const stats = data.stats || data;
            const buyCount = stats.buy || 0;
            const holdCount = stats.hold || 0;
            const sellCount = stats.sell || 0;
            const avgScore = stats.avg_score || 0;
            
            statsDiv.innerHTML = `
                <div class="stat-card buy">
                    <div class="label">🟢 建议买入/加仓</div>
                    <div class="value">${buyCount}</div>
                </div>
                <div class="stat-card hold">
                    <div class="label">🟡 建议持有/观望</div>
                    <div class="value">${holdCount}</div>
                </div>
                <div class="stat-card sell">
                    <div class="label">🔴 建议减仓/卖出</div>
                    <div class="value">${sellCount}</div>
                </div>
                <div class="stat-card">
                    <div class="label">📈 平均评分</div>
                    <div class="value">${avgScore}</div>
                </div>
            `;
        }
        
        function updateStocks(stocks) {
            const stocksDiv = document.getElementById('stocks');
            
            if (stocks.length === 0) {
                stocksDiv.innerHTML = '<div class="error">暂无分析结果</div>';
                return;
            }
            
            stocksDiv.innerHTML = stocks.map(stock => {
                const signalClass = getSignalClass(stock.operation_advice);
                const scoreClass = getScoreClass(stock.sentiment_score);
                const dashboard = stock.analysis_data?.dashboard || {};
                const core = dashboard.core_conclusion || {};
                const battle = dashboard.battle_plan || {};
                const sniper = battle.sniper_points || {};
                
                return `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div>
                                <div class="stock-name">${stock.name}</div>
                                <div class="stock-code">${stock.code}</div>
                            </div>
                            <span class="signal-badge ${signalClass}">${stock.operation_advice}</span>
                        </div>
                        
                        <div class="score ${scoreClass}">${stock.sentiment_score}分</div>
                        
                        <div class="info-row">
                            <span class="info-label">趋势预测</span>
                            <span class="info-value">${stock.trend_prediction}</span>
                        </div>
                        
                        ${core.one_sentence ? `
                        <div class="dashboard-section">
                            <div class="section-title">📌 核心结论</div>
                            <p style="color: #4b5563; font-size: 14px; line-height: 1.6;">
                                ${core.one_sentence}
                            </p>
                        </div>
                        ` : ''}
                        
                        ${sniper.ideal_buy || sniper.stop_loss || sniper.take_profit ? `
                        <div class="dashboard-section">
                            <div class="section-title">🎯 操作点位</div>
                            <div class="info-row">
                                <span class="info-label">理想买入</span>
                                <span class="info-value">${sniper.ideal_buy || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">止损位</span>
                                <span class="info-value">${sniper.stop_loss || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">目标位</span>
                                <span class="info-value">${sniper.take_profit || '-'}</span>
                            </div>
                        </div>
                        ` : ''}
                        
                        ${battle.action_checklist && battle.action_checklist.length > 0 ? `
                        <div class="dashboard-section">
                            <div class="section-title">✅ 检查清单</div>
                            <ul class="checklist">
                                ${battle.action_checklist.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function getSignalClass(advice) {
            if (['买入', '加仓', '强烈买入'].includes(advice)) return 'signal-buy';
            if (['持有', '观望'].includes(advice)) return 'signal-hold';
            return 'signal-sell';
        }
        
        function getScoreClass(score) {
            if (score >= 70) return 'high';
            if (score >= 40) return 'medium';
            return 'low';
        }
        
        // 页面加载时获取数据
        loadDashboard();
        
        // 每30秒自动刷新
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
