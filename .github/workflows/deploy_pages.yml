name: 部署到GitHub Pages

on:
  workflow_run:
    workflows: ["每日股票分析"]
    types:
      - completed
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 生成静态数据文件
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST || '600519' }}
        run: |
          mkdir -p data
          # 如果有数据库文件，尝试生成数据
          if [ -f "data/stock_analysis.db" ]; then
            python scripts/generate_static_data.py || echo "数据生成失败，使用空数据"
          else
            echo "数据库不存在，生成空数据文件"
            echo '{"success": true, "stocks": [], "stats": {"total": 0, "buy": 0, "hold": 0, "sell": 0, "avg_score": 0}}' > docs/dashboard_data.json
          fi
      
      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
